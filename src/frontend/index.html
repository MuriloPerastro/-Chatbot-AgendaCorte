<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaCorte Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones e Fontes modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-wrapper">
        <!-- Topo da Aplicação -->
        <header class="app-header">
            <div class="header-title">
                <h1>AgendaCorte Assistant</h1>
                <span class="badge-ia">IA v2.4</span>
            </div>
        </header>

        <!-- Container do Chat -->
        <div class="chat-container">
            <!-- Área de Mensagens -->
            <div id="chat-messages" class="chat-messages">
                <!-- Exemplo de mensagem do Bot com card especial (igual à sua referência) -->
                <div class="message-row bot-row">
                    <div class="bot-avatar">✨</div>
                    <div class="message-content">
                        <div class="sender-info">AgendaCorteBot <span class="time">13:58</span></div>
                        <div class="message bot security-card">
                            🔒 Seus dados estão seguros e não serão compartilhados com terceiros.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Área de Botões de Resposta Rápida -->
            <div id="chat-buttons" class="chat-buttons">
                <!-- Os botões gerados pelo bot entram aqui -->
            </div>

            <!-- Input de Envio de Mensagem -->
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Mandar mensagem para o AgendaCorte...">
                <button id="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
