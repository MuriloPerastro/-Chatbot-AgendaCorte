
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração | AgendaCorte</title>

    <link rel="stylesheet" href="/admin.css">
    <link rel="icon" href="/assets/CortesLabs.png">
</head>

<body>

    <main class="admin-container">

        <!-- TELA DE LOGIN -->
        <section id="login-section" class="login-section">

            <div class="login-card">

                <img
                    src="/assets/CortesLabs.png"
                    alt="CortesLabs"
                    class="admin-logo"
                >

                <h1>Área administrativa</h1>

                <p>
                    Entre com sua senha para acessar a agenda do salão.
                </p>

                <form id="login-form">

                    <label for="admin-password">
                        Senha administrativa
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                    >

                    <button type="submit" id="login-button">
                        Entrar
                    </button>

                    <p id="login-error" class="error-message"></p>

                </form>

            </div>

        </section>


        <!-- PAINEL ADMINISTRATIVO -->
        <section id="dashboard-section" class="dashboard-section" hidden>

            <header class="dashboard-header">

                <div class="header-info">
                    <span class="system-label">CORTESLABS</span>
                    <h1>Agenda administrativa</h1>
                    <p>Gerenciamento dos agendamentos do salão.</p>
                </div>

                <button id="logout-button" class="logout-button">
                    Sair
                </button>

            </header>


            <!-- NAVEGAÇÃO DA SEMANA -->
            <section class="week-navigation">

                <div>
                    <h2>Agenda semanal</h2>
                    <p id="week-period">
                        Carregando semana...
                    </p>
                </div>

                <div class="week-buttons">

                    <button id="previous-week" type="button">
                        &#10094;
                    </button>

                    <button id="current-week" type="button">
                        Hoje
                    </button>

                    <button id="next-week" type="button">
                        &#10095;
                    </button>

                </div>

            </section>


            <!-- RESUMO -->
            <section class="summary-section">

                <div class="summary-card">
                    <span>Total de agendamentos</span>
                    <strong id="total-appointments">0</strong>
                </div>

                <div class="summary-card">
                    <span>Profissionais</span>
                    <strong id="total-professionals">0</strong>
                </div>

            </section>


            <!-- LISTA DOS PROFISSIONAIS -->
            <section class="appointments-section">

                <div class="appointments-header">
                    <h2>Agendamentos por profissional</h2>
                </div>

                <div id="appointments-container">

                    <p class="loading-message">
                        Carregando agendamentos...
                    </p>

                </div>

            </section>

            <!-- MENSAGEM DE ERRO -->
            <p id="dashboard-error" class="error-message"></p>

        </section>

    </main>

    <script src="/admin.js" defer></script>

</body>
</html>
